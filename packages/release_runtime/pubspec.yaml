name: flutter_mcp_toolkit_release
description: >-
  Opt-in MCP runtime for shipped Flutter apps. Exposes a guarded,
  permission-checked MCP surface inside an Android release build without the
  Dart VM Service, service extensions, or Dart eval.
version: 0.4.0
publish_to: 'none'
license: MIT
repository: >-
  https://github.com/Arenukvern/mcp_flutter/tree/main/packages/release_runtime
issue_tracker: https://github.com/Arenukvern/mcp_flutter/issues
documentation: >-
  https://github.com/Arenukvern/mcp_flutter/tree/main/packages/release_runtime#readme
topics:
  - mcp
  - flutter
  - release
  - android
  - agentic-harness
environment:
  sdk: '>=3.13.0 <4.0.0'
resolution: workspace
dependencies:
  # Published MCP SDK: Streamable HTTP transport, sessions, protocol
  # negotiation, bearer-token and Origin enforcement. Pinned to the 3.x line
  # whose HTTP transport exists in the released package, not only upstream.
  mcp_server: ^3.1.1
  meta: ^1.18.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
