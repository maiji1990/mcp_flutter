name: flutter_mcp_toolkit_release_webview
description: >-
  Optional WebView DOM adapter for flutter_mcp_toolkit_release. Lets a release
  app expose its own trusted H5 pages to MCP clients without a VM Service,
  with origin allow-lists, fixed scripts, and snapshot-scoped refs.
version: 0.1.0
publish_to: 'none'
license: MIT
repository: >-
  https://github.com/maiji1990/mcp_flutter/tree/main/packages/release_runtime_webview
issue_tracker: https://github.com/maiji1990/mcp_flutter/issues
topics:
  - mcp
  - flutter
  - release
  - android
  - webview
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_mcp_toolkit_release: ^0.7.0
  # The official plugin is the only controller implementation v1 supports. The
  # adapter talks to it through ReleaseWebViewEngine, so a future
  # flutter_inappwebview integration does not touch the core tools.
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
