name: flutter_release_demo
description: >-
  Release-build demo for flutter_mcp_toolkit_release: a shipped-looking app
  whose UI an MCP client can observe and drive over loopback HTTP.
publish_to: 'none'
version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_mcp_toolkit_release: ^0.7.0
  flutter_mcp_toolkit_release_flutter: ^0.7.0
  # Optional WebView DOM adapter, exercised by the WebView demo screen.
  flutter_mcp_toolkit_release_webview: ^0.1.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
